[[stack]]
name = "infra"
[stack.config]
server = "Local"
auto_update = true
repo = "bhaaksema/homelab"
run_directory = "infra"

[[stack]]
name = "media"
[stack.config]
server = "Local"
auto_update = true
repo = "bhaaksema/homelab"
run_directory = "media"
environment = """
DOMAIN = [[DOMAIN]]
"""

[[stack]]
name = "tools"
[stack.config]
server = "Local"
auto_update = true
repo = "bhaaksema/homelab"
run_directory = "tools"
