[[stack]]
name = "infra"
[stack.config]
server = "Local"
auto_update = true
repo = "bhaaksema/homelab"
run_directory = "infra"
config_files = [
  { path = "Caddyfile", services = ["caddy"], requires = "Restart" }
]
extra_args = ["--remove-orphans"]
environment = """
DOMAIN = [[DOMAIN]]
CF_API_TOKEN = [[CF_API_TOKEN]]
TS_AUTHKEY = [[TS_AUTHKEY]]
"""

