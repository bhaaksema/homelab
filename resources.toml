[[server]]
name = "TrueNAS"
[server.config]
address = "https://periphery:8120"
enabled = true

##

[[stack]]
name = "homelab"
[stack.config]
server = "TrueNAS"
auto_update = true
repo = "bhaaksema/homelab"
run_directory = "stack"
file_paths = ["infra.yaml", "media.yaml", "tools.yaml"]
extra_args = ["--remove-orphans"]
environment = """
CF_DNS_API_TOKEN = [[CF_API_TOKEN]]
DOMAIN = [[DOMAIN]]
TS_AUTHKEY = [[TS_AUTHKEY]]
"""

##

[[resource_sync]]
name = "Procedures"
[resource_sync.config]
repo = "bhaaksema/homelab"
resource_path = ["procedures.toml"]
