services:
  traefik:
    image: traefik:v3
    command:
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls.certresolver=cloudflare
      - --certificatesresolvers.cloudflare.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare
      - --providers.docker.defaultrule=Host(`{{ index .Labels "com.docker.compose.service" }}.${DOMAIN}`)
    environment:
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/flux/apps/traefik:/letsencrypt
    ports:
      - 80:80
      - 443:443
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - host.docker.internal=host-gateway
    labels:
      - traefik.http.routers.apex.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.apex.middlewares=apex
      - traefik.http.routers.apex.service=noop@internal
      - traefik.http.middlewares.apex.redirectregex.regex=^https://[^/]+(.*)
      - traefik.http.middlewares.apex.redirectregex.replacement=https://truenas.${DOMAIN}$${1}
      - traefik.http.routers.truenas.rule=Host(`truenas.${DOMAIN}`)
      - traefik.http.routers.truenas.service=truenas
      - traefik.http.services.truenas.loadbalancer.server.url=http://host.docker.internal:81
      - traefik.http.routers.komodo.rule=Host(`komodo.${DOMAIN}`)
      - traefik.http.routers.komodo.service=komodo
      - traefik.http.services.komodo.loadbalancer.server.url=http://host.docker.internal:9120
    restart: unless-stopped
  tailscale:
    image: tailscale/tailscale
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_EXTRA_ARGS=--advertise-exit-node=true --reset
      - TS_HOSTNAME=komodo
      - TS_ROUTES=10.0.0.0/8,192.168.0.0/16
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
    volumes:
      - /mnt/flux/apps/tailscale:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
    labels:
      - traefik.enable=false
    restart: unless-stopped
