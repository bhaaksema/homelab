services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin
    environment:
      - PUID=568
      - PGID=568
      - TZ=Europe/Amsterdam
      - JELLYFIN_PublishedServerUrl=https://jellyfin.${DOMAIN}
    volumes:
      - /mnt/flux/apps/jellyfin:/config
      - /mnt/tank/media:/media
    network_mode: host
    devices:
      - /dev/dri:/dev/dri
    restart: unless-stopped
  radarr:
    image: lscr.io/linuxserver/radarr
    environment:
      - PUID=568
      - PGID=568
      - TZ=Europe/Amsterdam
    volumes:
      - /mnt/flux/apps/radarr:/config
      - /mnt/tank/media:/media
    restart: unless-stopped
  sonarr:
    image: lscr.io/linuxserver/sonarr
    environment:
      - PUID=568
      - PGID=568
      - TZ=Europe/Amsterdam
    volumes:
      - /mnt/flux/apps/sonarr:/config
      - /mnt/tank/media:/media
    restart: unless-stopped
  prowlarr:
    image: lscr.io/linuxserver/prowlarr
    environment:
      - PUID=568
      - PGID=568
      - TZ=Europe/Amsterdam
    volumes:
      - /mnt/flux/apps/prowlarr:/config
    restart: unless-stopped
  profilarr:
    image: ghcr.io/dictionarry-hub/profilarr
    environment:
      - PUID=568
      - PGID=568
      - TZ=Europe/Amsterdam
      - ORIGIN=https://profilarr.${DOMAIN}
    volumes:
      - /mnt/flux/apps/profilarr:/config
    restart: unless-stopped
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent
    environment:
      - PUID=568
      - PGID=568
      - TZ=Europe/Amsterdam
      - TORRENTING_PORT=51413
    volumes:
      - /mnt/flux/apps/qbittorrent:/config
      - /mnt/tank/media:/media
    ports:
      - 51413:51413
      - 51413:51413/udp
    restart: unless-stopped
