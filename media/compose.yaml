services:
  radarr:
    image: lscr.io/linuxserver/radarr
    environment:
      - PUID=568
      - PGID=568
      - TZ=Europe/Amsterdam
    volumes:
      - /mnt/flux/apps/radarr:/config
      - /mnt/tank/media:/media
    ports:
      - 7878:7878
    restart: unless-stopped
  sonarr:
    image: lscr.io/linuxserver/sonarr
    environment:
      - PUID=568
      - PGID=568
      - TZ=Europe/Amsterdam
    volumes:
      - /mnt/flux/apps/sonarr:/config
      - /mnt/tank/media:/media
    ports:
      - 8989:8989
    restart: unless-stopped
  prowlarr:
    image: lscr.io/linuxserver/prowlarr
    environment:
      - PUID=568
      - PGID=568
      - TZ=Europe/Amsterdam
    volumes:
      - /mnt/flux/apps/prowlarr:/config
    ports:
      - 9696:9696
    restart: unless-stopped
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent
    environment:
      - PUID=568
      - PGID=568
      - TZ=Europe/Amsterdam
      - TORRENTING_PORT=51413
    volumes:
      - /mnt/flux/apps/qbittorrent:/config
      - /mnt/tank/media:/media
    ports:
      - 8080:8080
      - 51413:51413
      - 51413:51413/udp
    restart: unless-stopped
