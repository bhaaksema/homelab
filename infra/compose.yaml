services:
  caddy:
    image: caddybuilds/caddy-cloudflare
    environment:
      - DOMAIN=${DOMAIN}
      - CF_API_TOKEN=${CF_API_TOKEN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /mnt/flux/apps/caddy/data:/data
      - /mnt/flux/apps/caddy/config:/config
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    cap_add:
      - NET_ADMIN
    extra_hosts:
      - host.docker.internal=host-gateway
    restart: unless-stopped
  tailscale:
    image: tailscale/tailscale
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_EXTRA_ARGS=--advertise-exit-node=true --reset
      - TS_HOSTNAME=komodo
      - TS_ROUTES=10.0.0.0/8,192.168.0.0/16
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
    volumes:
      - /mnt/flux/apps/tailscale:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
    restart: unless-stopped

networks:
  default:
    name: proxy
