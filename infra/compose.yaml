services:
  caddy:
    image: caddybuilds/caddy-cloudflare
    environment:
      - DOMAIN=${DOMAIN}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
    volumes:
      - ./caddy:/etc/caddy
      - /mnt/flux/apps/caddy/data:/data
      - /mnt/flux/apps/caddy/config:/config
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    cap_add:
      - NET_ADMIN
    extra_hosts:
      - host.docker.internal=host-gateway
    restart: unless-stopped
  tailscale:
    image: tailscale/tailscale
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_EXTRA_ARGS=--advertise-exit-node=true --reset
      - TS_HOSTNAME=komodo
      - TS_ROUTES=10.0.0.0/8,192.168.0.0/16
      - TS_STATE_DIR=/var/lib/tailscale
    volumes:
      - /mnt/flux/apps/tailscale:/var/lib/tailscale
    restart: unless-stopped
