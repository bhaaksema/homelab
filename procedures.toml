[[procedure]]
name = "Global Auto Deploy"
config.schedule = "Every day at 02:00"

[[procedure.config.stage]]
name = "Stage 1"
enabled = true
executions = [
  { execution.type = "RunSync", execution.params.sync = "Resources", enabled = true }
]

[[procedure.config.stage]]
name = "Stage 2"
enabled = true
executions = [
  { execution.type = "BatchDeployStackIfChanged", execution.params.pattern = "*", execution.params.tags = [], enabled = true }
]

##

[[resource_sync]]
name = "Resources"
[resource_sync.config]
repo = "bhaaksema/homelab"
resource_path = ["resources.toml"]
